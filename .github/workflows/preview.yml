name: Windows preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Do not interrupt a release while its assets and tag are being updated.
concurrency:
  group: windows-preview
  cancel-in-progress: false

jobs:
  preview:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Publish Windows x64
        run: dotnet publish monogame.csproj -c Release -r win-x64 --self-contained true -o artifacts/publish

      - name: Check and package
        run: |
          $required = @(
            'monogame.exe', 'monogame.dll', 'monogame.runtimeconfig.json',
            'MonoGame.Framework.dll', 'ImGui.NET.dll', 'cimgui.dll',
            'coreclr.dll', 'hostfxr.dll', 'System.Windows.Forms.dll',
            'Content/Effects/TileSurface.xnb'
          )
          foreach ($file in $required) {
            if (!(Test-Path -LiteralPath "artifacts/publish/$file" -PathType Leaf)) {
              throw "Missing published file: $file"
            }
          }
          @(
            "Commit: $env:GITHUB_SHA"
            "Built: $([DateTime]::UtcNow.ToString('o'))"
            "Run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          ) | Set-Content artifacts/publish/version.txt -Encoding utf8
          Compress-Archive -Path artifacts/publish/* -DestinationPath artifacts/v3like-win-x64.zip

      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/v3like-win-x64.zip
          retention-days: 14
          compression-level: 0
          if-no-files-found: error

      - name: Update preview release
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs');
            const repo = context.repo;
            const tag = 'preview';
            const name = 'v3like-win-x64.zip';
            const { data: head } = await github.rest.git.getRef({ ...repo, ref: 'heads/main' });
            if (head.object.sha !== context.sha) {
              core.notice('A newer commit is on main; keeping this build as an artifact only.');
              return;
            }
            let release;
            try {
              ({ data: release } = await github.rest.repos.getReleaseByTag({ ...repo, tag }));
            } catch (error) {
              if (error.status !== 404) throw error;
              ({ data: release } = await github.rest.repos.createRelease({
                ...repo, tag_name: tag, target_commitish: context.sha,
                name: 'Windows preview', prerelease: true, draft: true
              }));
            }
            if (release.immutable) {
              throw new Error('The preview release is immutable; rolling previews require mutable releases. The build is available in Actions artifacts.');
            }
            // Upload first, so an upload failure does not remove the previous download.
            const { data: asset } = await github.rest.repos.uploadReleaseAsset({
              ...repo, release_id: release.id,
              name: `preview-${context.runId}-${process.env.GITHUB_RUN_ATTEMPT}.zip`,
              data: fs.readFileSync('artifacts/v3like-win-x64.zip')
            });
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              ...repo, release_id: release.id, per_page: 100
            });
            for (const old of assets.filter(a => a.name === name)) {
              await github.rest.repos.deleteReleaseAsset({ ...repo, asset_id: old.id });
            }
            await github.rest.repos.updateReleaseAsset({ ...repo, asset_id: asset.id, name });
            try {
              await github.rest.git.updateRef({ ...repo, ref: `tags/${tag}`, sha: context.sha, force: true });
            } catch (error) {
              if (error.status !== 422 && error.status !== 404) throw error;
              await github.rest.git.createRef({ ...repo, ref: `refs/tags/${tag}`, sha: context.sha });
            }
            const url = `${process.env.GITHUB_SERVER_URL}/${repo.owner}/${repo.repo}`;
            await github.rest.repos.updateRelease({
              ...repo, release_id: release.id, name: 'Windows preview',
              draft: false, prerelease: true, make_latest: 'false',
              body: `Windows x64 preview. Extract the entire ZIP and run monogame.exe.\n\nCommit: ${context.sha}\nBuild: ${url}/actions/runs/${context.runId}\n\nEsc: exit. F5: debug panel.`
            });
            await core.summary.addLink('Download Windows preview', `${url}/releases/download/${tag}/${name}`).write();
